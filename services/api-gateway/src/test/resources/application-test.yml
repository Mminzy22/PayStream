server:
  port: 0

spring:
  application:
    name: api-gateway
  config:
    activate:
      on-profile: test

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        exclude: health,info
    jmx:
      exposure:
        include: "*"

jwt:
  secret: test-secret-key-for-jwt-token-generation-in-test-environment-only
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
